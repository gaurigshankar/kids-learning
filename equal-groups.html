<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Share the Cookies</title>
<style>
:root {
  --bg: #fbf7ee; --panel: #ffffff; --ink: #26303b; --muted: #8a8272; --line: #e3dccb;
  --accent: #1e5bd8; --good: #1e8e3e; --gold: #f6b93b; --sky: #4aa8e8;
  --btn: 56px; --pc: 52px; --safe-b: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: manipulation;
  background: var(--bg); color: var(--ink);
  font-family: "Nunito", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app {
  height: 100dvh; display: grid; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px calc(var(--safe-b) + 10px);
  grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; grid-template-areas: "top" "friends" "pile";
  max-width: 1200px; margin: 0 auto;
}
@media (orientation: landscape) and (min-aspect-ratio: 23/20) {
  #app { grid-template-rows: auto 1fr; grid-template-columns: auto 1fr; grid-template-areas: "top top" "pile friends"; }
}

/* top bar */
#top { grid-area: top; display: flex; align-items: center; gap: 8px; min-height: 64px; }
.ibtn {
  position: relative; overflow: hidden; width: var(--btn); height: var(--btn); border-radius: 50%; flex: none;
  border: 3px solid var(--line); background: var(--panel); font-size: calc(var(--btn) * .5); line-height: 1; padding: 0;
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.ibtn:active { transform: scale(.92); }
#home::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(30,91,216,.3); }
#home.holding::after { height: 100%; transition: height .6s linear; }
#dots { flex: 1; display: flex; justify-content: center; gap: 8px; font-size: 30px; }
#dots span { filter: grayscale(1); opacity: .35; transition: all .3s; }
#dots span.on { filter: none; opacity: 1; transform: scale(1.15); }
#bobo { width: 72px; height: 72px; font-size: 48px; border-color: var(--gold); background: #fff3d1; animation: bounce 8s infinite; }
#bobo.cheer { animation: jump .5s 2; }
:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

/* friends */
#friends { grid-area: friends; min-height: 0; display: grid; gap: 10px; align-content: center; justify-content: center; }
.friend {
  position: relative; background: var(--panel); border: 4px solid var(--line); border-radius: 26px; padding: 6px 6px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: border-color .2s, background .2s, transform .15s;
}
.friend:active { transform: scale(.97); }
.friend .face { line-height: 1; }
.friend.hot { border-color: var(--sky); background: color-mix(in srgb, var(--sky) 14%, var(--panel)); transform: scale(1.05); }
.friend.needy { border-color: var(--gold); animation: pulse 1s infinite; }
.friend.wobble { animation: wobble .6s infinite; }
.friend.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 13%, var(--panel)); }
.friend.munch .face { animation: munch .25s; }
.plate { display: grid; gap: 6px; justify-content: center; align-content: start; padding: 6px; border-radius: 50% / 30%; background: color-mix(in srgb, var(--line) 40%, transparent); }
.slot { display: grid; place-items: center; }
.slot.ghost { border: 3px dashed color-mix(in srgb, var(--gold) 80%, #888); border-radius: 12px; background: color-mix(in srgb, var(--gold) 14%, transparent); }
.badge { position: absolute; top: -10px; right: -10px; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 900; font-size: 26px; display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.25); }
.badge.pop { animation: pop .25s; }
.point { position: absolute; top: -26px; left: 50%; margin-left: -18px; font-size: 38px; animation: point 0.9s infinite; pointer-events: none; z-index: 5; }

/* cookies */
.ck { display: grid; place-items: center; line-height: 1; touch-action: none; cursor: grab; position: relative; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.ck.sel { animation: bob .6s infinite; filter: drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 3px var(--gold)); }
.ck.lifted { opacity: .25; }
.float { position: fixed; z-index: 100; pointer-events: none; line-height: 1; display: grid; place-items: center; filter: drop-shadow(0 10px 8px rgba(0,0,0,.35)); transform: scale(1.25) rotate(-6deg); }
.flyer { position: fixed; z-index: 90; pointer-events: none; line-height: 1; display: grid; place-items: center; opacity: .75; }

/* pile */
#pilewrap { grid-area: pile; background: var(--panel); border: 3px solid var(--line); border-radius: 26px; padding: 10px; display: flex; align-items: center; justify-content: center; align-self: end; }
@media (orientation: landscape) and (min-aspect-ratio: 23/20) { #pilewrap { align-self: stretch; } }
#pilewrap.hot { border-color: var(--sky); background: color-mix(in srgb, var(--sky) 12%, var(--panel)); }
#pile { display: grid; gap: 8px; }
#pile .cell { display: grid; place-items: center; }

/* picker */
.pick {
  background: var(--panel); border: 4px solid var(--line); border-radius: 26px; padding: 8px; cursor: pointer; font: inherit; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative;
}
.pick:active { transform: scale(.95); }
.pick .crowd { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; line-height: 1; }
.pick .num { font-weight: 900; font-size: 22px; color: var(--muted); }
.pick.done { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--panel)); }
.pick.done::after { content: "\2B50"; position: absolute; top: -12px; right: -8px; font-size: 32px; }
.pick.next { border-color: var(--gold); animation: pulse 1s infinite; }
.pick.go { background: var(--good); border-color: var(--good); color: #fff; font-size: 64px; font-weight: 900; }

/* overlays */
.overlay { position: fixed; inset: 0; z-index: 200; background: color-mix(in srgb, var(--bg) 94%, transparent); display: grid; place-items: center; align-content: center; gap: 18px; text-align: center; }
.overlay[hidden] { display: none; }
.bigplay { width: 168px; height: 168px; border-radius: 50%; border: 0; background: var(--good); color: #fff; font-size: 84px; box-shadow: 0 10px 0 #136b2c; cursor: pointer; display: grid; place-items: center; padding: 0 0 0 10px; animation: pulse 1.2s infinite; }
.bigplay:active { transform: translateY(6px); box-shadow: 0 4px 0 #136b2c; }
.overlay .mascot { font-size: 96px; line-height: 1; }
.overlay .stars { font-size: 64px; letter-spacing: 6px; }
.confetti { position: fixed; top: -40px; z-index: 150; pointer-events: none; font-size: 32px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@keyframes pulse { 50% { transform: scale(1.05); } }
@keyframes bounce { 0%, 90%, 100% { transform: none; } 94% { transform: translateY(-8px); } 97% { transform: none; } }
@keyframes jump { 50% { transform: translateY(-14px) scale(1.1); } }
@keyframes wobble { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes pop { 50% { transform: scale(1.35); } }
@keyframes munch { 50% { transform: scale(1.15); } }
@keyframes point { 50% { transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) {
  #bobo, #bobo.cheer, .friend.needy, .friend.wobble, .pick.next, .bigplay, .ck.sel, .point, .badge.pop, .friend.munch .face { animation: none; }
  .friend.needy, .pick.next { box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 50%, transparent); }
}
@media (min-width: 700px) { :root { --btn: 64px; } }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ibtn" id="home" aria-label="Hold to go home">🏠</button>
    <div id="dots" aria-hidden="true"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <button class="ibtn" id="say" aria-label="Say it again">🔊</button>
    <button class="ibtn" id="again" aria-label="Start this one again">🔄</button>
    <button class="ibtn" id="bobo" aria-label="Help">🐻</button>
  </div>
  <div id="friends"></div>
  <div id="pilewrap" data-zone="pile"><div id="pile" role="group" aria-label="Cookie pile"></div></div>
</div>

<div class="overlay" id="cover">
  <div class="mascot">🐻🍪</div>
  <button class="bigplay" id="play" aria-label="Play">▶</button>
</div>
<div class="overlay" id="levelend" hidden>
  <div class="mascot">🤗</div>
  <div class="stars">⭐⭐⭐</div>
  <button class="bigplay" id="levelnext" aria-label="Next">▶</button>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FACES = ['🐶', '🐱', '🐰', '🐸', '🦊', '🐼'];
  var WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
  var COLS = { 1: 1, 2: 2, 3: 3, 4: 2, 5: 3, 6: 3, 7: 4, 8: 4, 9: 3, 10: 5, 11: 4, 12: 4 };
  /* level: piles (3 per level), preset G (0 = child chooses), needAll = must find every way */
  var LEVELS = {
    1: { piles: [4, 6, 8], G: 2 },
    2: { piles: [6, 9, 12], G: 3 },
    3: { piles: [6, 8, 12], G: 0, needAll: false },
    4: { piles: [12, 10, 8], G: 0, needAll: true }
  };
  var COPY = {
    start: 'Let’s share the cookies!',
    goal: 'Give every friend the same number of cookies.',
    who: 'Who is coming to share?',
    needy: 'Who needs a cookie?',
    give: 'Give a cookie to this friend.',
    watch: 'Watch me!',
    uneven: 'Hmm, let’s make it fair!',
    another: 'Can we share a different way?',
    all: 'You found every way! Amazing!',
    done: 'You did it!'
  };

  var level = 1, piles = [], pileIdx = 0, done = [false, false, false], found = {};
  var N = 4, G = 2, pile = [], plates = [];
  var mode = 'cover';              /* cover | deal | celebrate | picker | levelend */
  var hintLevel = 0, uneven = false, selected = null, autoTimer = null, idleTimers = [], lastDragEnd = 0, drag = null;
  var pc = 52, home = $('home');

  try { var sv = JSON.parse(localStorage.getItem('eg_v2')); if (sv && LEVELS[sv.level]) level = sv.level; } catch (e) {}
  function save() { try { localStorage.setItem('eg_v2', JSON.stringify({ level: level })); } catch (e) {} }

  /* ---------- sound ---------- */
  var Speaker = {
    ok: 'speechSynthesis' in window, voice: null,
    init: function () {
      if (!this.ok) return; var self = this;
      function pick() {
        var vs = speechSynthesis.getVoices(); if (!vs.length) return;
        var en = vs.filter(function (v) { return /^en/i.test(v.lang); });
        var pref = en.filter(function (v) { return /Samantha|Ava|Karen|Allison|Susan|Zira/i.test(v.name); });
        self.voice = pref[0] || en.filter(function (v) { return /en[-_]US/i.test(v.lang); })[0] || en[0] || null;
      }
      pick(); speechSynthesis.onvoiceschanged = pick;
    },
    say: function (t) {
      $('live').textContent = t;
      if (!this.ok) return;
      try {
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1.15; if (this.voice) u.voice = this.voice;
        speechSynthesis.speak(u);
      } catch (e) {}
    },
    count: function (n) { this.say(WORDS[n] || String(n)); }
  };
  var actx = null;
  function unlockAudio() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { actx = null; }
  }
  function tone(f1, f2, dur, delay) {
    if (!actx) return;
    try {
      var t = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  var Sfx = {
    pop: function () { tone(520, 880, 0.08); },
    boing: function () { tone(400, 200, 0.15); },
    chime: function () { tone(523, 523, 0.18, 0); tone(659, 659, 0.18, 0.15); tone(784, 784, 0.3, 0.3); }
  };

  /* ---------- helpers ---------- */
  function ways() { var w = []; for (var g = 2; g <= 6; g++) if (N % g === 0 && g !== N) w.push(g); return w; }
  function foundFor() { return found[N] || (found[N] = {}); }
  function counts() { return plates.map(function (p) { return p.length; }); }
  function neediest() { var c = counts(), m = Math.min.apply(null, c); return c.indexOf(m); }
  function isFair() { var c = counts(); return pile.length === 0 && c.every(function (x) { return x === c[0]; }); }
  function setTimers() {
    clearTimers();
    if (mode !== 'deal') return;
    idleTimers = [
      setTimeout(function () { escalate(1); }, 6000),
      setTimeout(function () { escalate(2); }, 12000),
      setTimeout(function () { escalate(3); }, 20000)
    ];
  }
  function clearTimers() { idleTimers.forEach(clearTimeout); idleTimers = []; }
  function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  /* ---------- game flow ---------- */
  function startLevel() {
    piles = LEVELS[level].piles; pileIdx = 0; done = [false, false, false]; found = {};
    $('levelend').hidden = true; startPile();
  }
  function startPile() {
    N = piles[pileIdx]; clearTimers(); stopAuto();
    if (LEVELS[level].G) { G = LEVELS[level].G; startRound(true); }
    else { mode = 'picker'; pile = []; for (var i = 0; i < N; i++) pile.push(i); plates = []; selected = null; hintLevel = 0; Speaker.say(COPY.who); render(); }
  }
  function startRound(speak) {
    pile = []; for (var i = 0; i < N; i++) pile.push(i);
    plates = []; for (var g = 0; g < G; g++) plates.push([]);
    mode = 'deal'; uneven = false; selected = null; stopAuto();
    hintLevel = (level === 1 && pileIdx === 0) ? 1 : 0;
    if (speak) Speaker.say(pileIdx === 0 && level <= 2 ? COPY.goal : 'Share ' + WORDS[N] + ' cookies with ' + WORDS[G] + ' friends.');
    setTimers(); render();
  }
  function escalate(n) {
    if (mode !== 'deal' || autoTimer) return;
    if (n <= hintLevel && n !== 3) return;
    hintLevel = Math.max(hintLevel, n);
    if (hintLevel === 1) Speaker.say(COPY.needy);
    else if (hintLevel === 2) { Speaker.say(COPY.give); flyGhost(); }
    else if (hintLevel >= 3) { autoDeal(); return; }
    render();
  }
  function boboTap() {
    if (mode !== 'deal') { var t = mode === 'picker' ? COPY.who : COPY.goal; Speaker.say(t); return; }
    escalate(Math.min(3, hintLevel + 1));
  }
  function autoDeal() {
    clearTimers(); Speaker.say(COPY.watch); hintLevel = 3; render();
    setTimeout(function () {
      if (mode !== 'deal') return;
      autoTimer = setInterval(function () {
        if (mode !== 'deal' || !pile.length) { stopAuto(); return; }
        var id = Math.max.apply(null, pile), e = document.querySelector('[data-id="' + id + '"]');
        move(id, 'p', neediest(), e ? e.getBoundingClientRect() : null);
      }, 900);
    }, 1200);
  }
  function flyGhost() {
    if (!pile.length || REDUCED) return;
    var id = Math.max.apply(null, pile), src = document.querySelector('[data-id="' + id + '"]'), tgt = document.querySelectorAll('.friend')[neediest()];
    if (!src || !tgt) return;
    var a = src.getBoundingClientRect(), b = tgt.getBoundingClientRect(), f = el('div', 'flyer', '🍪');
    f.style.fontSize = Math.round(pc * .8) + 'px'; f.style.left = a.left + 'px'; f.style.top = a.top + 'px'; f.style.width = a.width + 'px'; f.style.height = a.height + 'px';
    document.body.appendChild(f);
    var an = f.animate([{ transform: 'none' }, { transform: 'translate(' + (b.left + b.width / 2 - a.left - a.width / 2) + 'px,' + (b.top + b.height / 2 - a.top - a.height / 2) + 'px)' }], { duration: 900, easing: 'ease-in-out' });
    an.onfinish = function () { f.remove(); };
  }

  /* move a cookie: from 'p' or plate index -> 'p' or plate index. srcRect is where it visually came from. */
  function move(id, from, to, srcRect) {
    if (mode !== 'deal' || from === to) return;
    var src = from === 'p' ? pile : plates[from];
    var k = src.indexOf(id); if (k < 0) return;
    src.splice(k, 1);
    (to === 'p' ? pile : plates[to]).push(id);
    uneven = false; selected = null; hintLevel = Math.max(0, hintLevel > 2 ? 0 : hintLevel - 1);
    if (!autoTimer) setTimers();
    render();
    var n = document.querySelector('[data-id="' + id + '"]');
    if (n && srcRect && !REDUCED) {
      var r = n.getBoundingClientRect(); n.style.zIndex = 50;
      n.animate([{ transform: 'translate(' + (srcRect.left - r.left) + 'px,' + (srcRect.top - r.top) + 'px) scale(1.2)' }, { transform: 'none' }], { duration: 350, easing: 'ease-out' });
    }
    if (to === 'p') { Sfx.boing(); }
    else {
      Sfx.pop(); Speaker.count(plates[to].length);
      var card = document.querySelectorAll('.friend')[to];
      if (card) { card.classList.add('munch'); var bd = card.querySelector('.badge'); if (bd) bd.classList.add('pop'); }
    }
    if (!pile.length) setTimeout(evaluate, 800);
  }
  function evaluate() {
    if (mode !== 'deal' || pile.length) return;
    if (isFair()) success();
    else { uneven = true; hintLevel = Math.max(hintLevel, 2); Speaker.say(COPY.uneven); render(); }
  }

  function success() {
    mode = 'celebrate'; clearTimers(); stopAuto(); hintLevel = 0;
    var t = N / G, f = foundFor(); f[G] = true;
    render(); Sfx.chime(); confetti(); Speaker.say('Everybody has ' + WORDS[t] + '! That’s fair!');
    var b = $('bobo'); b.textContent = '🤗'; b.classList.add('cheer');
    setTimeout(function () { b.textContent = '🐻'; b.classList.remove('cheer'); }, 1200);
    var preset = !!LEVELS[level].G;
    if (preset) done[pileIdx] = true;
    else { var need = LEVELS[level].needAll ? ways().every(function (g) { return f[g]; }) : true; if (need) done[pileIdx] = true; }
    renderDots();
    setTimeout(function () { if (mode !== 'celebrate') return; preset ? nextPile() : showPicker(); }, 3200);
  }
  function showPicker() {
    mode = 'picker'; hintLevel = 0;
    var f = foundFor(), all = ways().every(function (g) { return f[g]; });
    Speaker.say(all ? COPY.all : COPY.another); render();
  }
  function nextPile() {
    pileIdx++;
    if (pileIdx >= piles.length) levelDone(); else startPile();
  }
  function levelDone() {
    mode = 'levelend'; clearTimers(); Sfx.chime(); Speaker.say(COPY.done); $('levelend').hidden = false;
  }

  function confetti() {
    if (REDUCED) return;
    var E = ['🎉', '⭐', '🍪', '✨'];
    for (var i = 0; i < 24; i++) {
      var c = el('div', 'confetti', E[i % E.length]); c.style.left = (Math.random() * 95) + 'vw'; document.body.appendChild(c);
      (function (c) { var a = c.animate([{ transform: 'translateY(0) rotate(0)', opacity: 1 }, { transform: 'translateY(' + (window.innerHeight + 80) + 'px) rotate(' + (Math.random() * 540 - 270) + 'deg)', opacity: 1 }], { duration: 1400 + Math.random() * 400, delay: Math.random() * 250, easing: 'ease-in', fill: 'both' }); a.onfinish = function () { c.remove(); }; })(c);
    }
  }

  /* ---------- rendering ---------- */
  function isLandscape() { return window.innerWidth > window.innerHeight * 1.15; }
  function layoutPile() {
    var w = window.innerWidth, h = window.innerHeight, cols, rows;
    if (isLandscape()) {
      cols = N > 8 ? 3 : 2; rows = Math.ceil(N / cols);
      var colW = Math.min(300, w * 0.28);
      pc = Math.floor(Math.max(34, Math.min(72, (colW - 24) / cols - 8, (h - 130) / rows - 8)));
    } else {
      cols = N <= 6 ? N : Math.ceil(N / 2); rows = Math.ceil(N / cols);
      pc = Math.floor(Math.max(40, Math.min(72, (Math.min(w, 1200) - 24 - 20 - 8 * (cols - 1)) / cols)));
    }
    var p = $('pile'); p.style.gridTemplateColumns = 'repeat(' + cols + ', ' + pc + 'px)'; p.style.gridAutoRows = pc + 'px';
    document.documentElement.style.setProperty('--pc', pc + 'px');
  }
  function ckEl(id, from, size) {
    var c = el('div', 'ck', '🍪'); c.dataset.id = id; c.dataset.from = from;
    c.style.width = c.style.height = size + 'px'; c.style.fontSize = Math.round(size * .82) + 'px';
    if (selected === id) c.classList.add('sel');
    c.addEventListener('pointerdown', onDown);
    c.addEventListener('click', function (e) { e.stopPropagation(); });
    return c;
  }
  function renderPile() {
    var p = $('pile'); p.innerHTML = '';
    for (var i = 0; i < N; i++) {
      var cell = el('div', 'cell');
      if (pile.indexOf(i) >= 0) cell.appendChild(ckEl(i, 'p', pc));
      p.appendChild(cell);
    }
    p.setAttribute('aria-label', 'Cookie pile, ' + pile.length + ' left');
  }
  function renderDots() { var d = $('dots').children; for (var i = 0; i < 3; i++) d[i].className = done[i] ? 'on' : ''; }

  function renderFriends() {
    var box = $('friends'); box.innerHTML = '';
    var aw = box.clientWidth, ah = box.clientHeight, gap = 10;
    var perRow = G <= 3 ? G : (G === 4 ? 2 : 3), rows = Math.ceil(G / perRow);
    var cw = Math.floor((aw - gap * (perRow - 1)) / perRow), ch = Math.floor(Math.min((ah - gap * (rows - 1)) / rows, 300));
    var t = N / G, cols = COLS[t] || 4, srows = Math.ceil(t / cols), sgap = 6;
    var face = Math.max(34, Math.min(64, Math.floor(ch * .22)));
    var slot = Math.floor(Math.max(24, Math.min(56, (cw - 28 - (cols - 1) * sgap) / cols, (ch - face - 40 - (srows - 1) * sgap) / srows)));
    box.style.gridTemplateColumns = 'repeat(' + perRow + ', ' + cw + 'px)';
    var need = neediest(), c = counts(), mn = Math.min.apply(null, c), good = mode === 'celebrate';
    plates.forEach(function (pl, g) {
      var card = el('div', 'friend'); card.dataset.g = g; card.style.height = ch + 'px';
      card.setAttribute('role', 'button'); card.tabIndex = 0; card.setAttribute('aria-label', 'Friend ' + (g + 1) + ', ' + pl.length + ' cookies');
      if (good) card.classList.add('good');
      var needy = mode === 'deal' && hintLevel >= 1 && g === need && (pile.length || uneven);
      if (needy) { card.classList.add('needy'); card.appendChild(el('div', 'point', '👆')); }
      if (uneven && pl.length > mn) card.classList.add('wobble');
      var f = el('div', 'face', FACES[g]); f.style.fontSize = face + 'px'; card.appendChild(f);
      var plate = el('div', 'plate'); plate.style.gridTemplateColumns = 'repeat(' + cols + ', ' + slot + 'px)'; plate.style.gridAutoRows = slot + 'px';
      var ghosts = level <= 2 || hintLevel >= 2 || (level === 3 && pl.length === 0) || uneven;
      for (var k = 0; k < Math.max(t, pl.length); k++) {
        var s = el('div', 'slot');
        if (k < pl.length) s.appendChild(ckEl(pl[k], g, slot));
        else if (ghosts) s.classList.add('ghost');
        plate.appendChild(s);
      }
      card.appendChild(plate);
      if (level >= 3 || good) { var b = el('div', 'badge', pl.length); card.appendChild(b); }
      card.addEventListener('click', function () { if (Date.now() - lastDragEnd < 350) return; tapFriend(g); });
      card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tapFriend(g); } });
      box.appendChild(card);
    });
  }

  function renderPicker() {
    var box = $('friends'); box.innerHTML = '';
    var aw = box.clientWidth, ah = box.clientHeight, w = ways(), f = foundFor(), gap = 12;
    var showGo = done[pileIdx];
    var items = w.length + (showGo ? 1 : 0), per = Math.min(items, aw > 560 ? 4 : 2), rows = Math.ceil(items / per);
    var cw = Math.min(170, Math.floor((aw - gap * (per - 1)) / per)), chh = Math.min(170, Math.floor((ah - gap * (rows - 1)) / rows));
    box.style.gridTemplateColumns = 'repeat(' + per + ', ' + cw + 'px)';
    var nextG = null; w.forEach(function (g) { if (nextG === null && !f[g]) nextG = g; });
    w.forEach(function (g) {
      var b = el('button', 'pick' + (f[g] ? ' done' : '') + (g === nextG ? ' next' : '')); b.style.height = chh + 'px';
      b.setAttribute('aria-label', g + ' friends');
      var crowd = el('div', 'crowd'); crowd.style.fontSize = Math.max(22, Math.min(40, Math.floor(cw / (g > 3 ? 3.4 : 2.4)))) + 'px';
      for (var i = 0; i < g; i++) crowd.appendChild(el('span', '', FACES[i]));
      b.appendChild(crowd); b.appendChild(el('div', 'num', g));
      b.addEventListener('click', function () { G = g; startRound(true); });
      box.appendChild(b);
    });
    if (showGo) {
      var go = el('button', 'pick go', '▶'); go.style.height = chh + 'px'; go.setAttribute('aria-label', 'Next');
      go.addEventListener('click', nextPile); box.appendChild(go);
    }
  }

  function render() {
    layoutPile(); renderPile(); renderDots();
    if (mode === 'picker') renderPicker(); else if (mode !== 'cover') renderFriends();
    /* the pile area changes height after the pile is drawn, so size friends again */
    if (mode !== 'picker' && mode !== 'cover') { /* sizes use current clientHeight; one more pass keeps it exact */ }
  }

  /* ---------- input ---------- */
  function tapFriend(g) {
    if (mode !== 'deal' || drag) return;
    if (!pile.length) return;
    var id = selected !== null && pile.indexOf(selected) >= 0 ? selected : Math.max.apply(null, pile);
    var e = document.querySelector('[data-id="' + id + '"]');
    move(id, 'p', g, e ? e.getBoundingClientRect() : null);
  }
  function friendNear(x, y) {
    var best = -1, bd = 1e9, cards = document.querySelectorAll('.friend');
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect(), d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
      var inside = x >= r.left - 24 && x <= r.right + 24 && y >= r.top - 24 && y <= r.bottom + 24;
      if (inside) d = d * 0.3;
      if (d < bd) { bd = d; best = i; }
    }
    return bd < 140 ? best : -1;
  }
  function overPile(x, y) { var r = $('pilewrap').getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }

  function onDown(e) {
    if (mode !== 'deal' || drag) return;
    if (e.pointerType === 'touch' && e.width > 60) return;      /* palm */
    e.preventDefault(); stopAuto(); clearTimers();
    var t = e.currentTarget, r = t.getBoundingClientRect();
    drag = { id: +t.dataset.id, from: t.dataset.from === 'p' ? 'p' : +t.dataset.from, sx: e.clientX, sy: e.clientY, moved: false, fl: null, w: r.width, h: r.height, pid: e.pointerId, el: t };
    try { t.setPointerCapture(e.pointerId); } catch (x) {}
    t.addEventListener('pointermove', onMove); t.addEventListener('pointerup', onUp); t.addEventListener('pointercancel', onCancel); t.addEventListener('lostpointercapture', onCancel);
  }
  function floatAt(e) { drag.fl.style.left = (e.clientX - drag.w / 2) + 'px'; drag.fl.style.top = (e.clientY - 48 - drag.h / 2) + 'px'; }
  function onMove(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 10) {
      drag.moved = true; var f = el('div', 'float', '🍪'); f.style.width = drag.w + 'px'; f.style.height = drag.h + 'px'; f.style.fontSize = Math.round(drag.w * .82) + 'px';
      document.body.appendChild(f); drag.fl = f; drag.el.classList.add('lifted');
    }
    if (!drag.moved) return;
    floatAt(e);
    var cx = e.clientX, cy = e.clientY - 48, n = friendNear(cx, cy), cards = document.querySelectorAll('.friend');
    for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('hot', i === n);
    $('pilewrap').classList.toggle('hot', n < 0 && overPile(cx, cy));
  }
  function endDrag() {
    var d = drag; if (!d) return null;
    var t = d.el; t.removeEventListener('pointermove', onMove); t.removeEventListener('pointerup', onUp); t.removeEventListener('pointercancel', onCancel); t.removeEventListener('lostpointercapture', onCancel);
    document.querySelectorAll('.hot').forEach(function (n) { n.classList.remove('hot'); });
    var rect = d.fl ? d.fl.getBoundingClientRect() : null; if (d.fl) d.fl.remove();
    drag = null; lastDragEnd = Date.now(); return { d: d, rect: rect };
  }
  function onCancel() { if (!drag) return; endDrag(); render(); setTimers(); }
  function onUp(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    var r = endDrag(), d = r.d;
    if (!d.moved) {                           /* a tap */
      if (d.from === 'p') { selected = selected === d.id ? null : d.id; render(); setTimers(); }
      else { move(d.id, d.from, 'p', d.el.getBoundingClientRect()); }
      return;
    }
    var cx = e.clientX, cy = e.clientY - 48, n = friendNear(cx, cy);
    if (n >= 0) move(d.id, d.from, n, r.rect);
    else if (overPile(cx, cy) && d.from !== 'p') move(d.id, d.from, 'p', r.rect);
    else { render(); setTimers(); }           /* nowhere: it just goes back, quietly */
  }
  document.addEventListener('pointerdown', function () { if (autoTimer) { stopAuto(); setTimers(); } }, true);
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { if (drag) onCancel(); if (Speaker.ok) speechSynthesis.cancel(); } });
  window.addEventListener('pagehide', function () { if (Speaker.ok) speechSynthesis.cancel(); });

  /* ---------- buttons ---------- */
  var holdT = null;
  function holdStart() { home.classList.add('holding'); clearTimeout(holdT); holdT = setTimeout(function () { location.href = 'index.html'; }, 600); }
  function holdEnd() { home.classList.remove('holding'); clearTimeout(holdT); }
  home.addEventListener('pointerdown', holdStart);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { home.addEventListener(ev, holdEnd); });
  $('bobo').addEventListener('click', boboTap);
  $('say').addEventListener('click', function () { Speaker.say(mode === 'picker' ? COPY.who : COPY.goal); });
  $('again').addEventListener('click', function () { if (mode === 'deal') startRound(false); else if (mode === 'picker') render(); });
  $('levelnext').addEventListener('click', function () { if (level < 4) level++; save(); startLevel(); });
  $('play').addEventListener('click', function () {
    unlockAudio(); $('cover').hidden = true; Speaker.init(); Speaker.say(COPY.start);
    setTimeout(startLevel, 50);
  });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (!drag && mode !== 'cover') render(); }, 120); });
  window.addEventListener('orientationchange', function () { if (drag) onCancel(); });
  Speaker.init(); renderDots();
})();
</script>
</body>
